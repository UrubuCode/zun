[workspace]
resolver = "2"
members = [
    "crates/zun_common",
    "crates/zun_core",
    "crates/zun_metadata",
    "crates/zun_il",
    "crates/zun_module",
    "crates/zun_syntax",
    "crates/zun_sema",
    "crates/zun_ilgen",
    "crates/zun_interp",
    "crates/zun_sched",
    "crates/zun_vm",
    "crates/zun_cli",
    "crates/zun_verify",
    "crates/zun_codegen",
    "crates/zun_prelude",
    "crates/zun_gc",
    "crates/zun_natives",
    "crates/zun_abi",
    "crates/zun_compiler",
    "crates/zun_loader",
    "crates/zun_types",
    "crates/zun_regex",
    "crates/zun_runtime",
    "xtask",
]

[workspace.dependencies]
cranelift-codegen = { version = "0.131", features = ["arm64"] }
cranelift-frontend = "0.131"
cranelift-jit = "0.131"
cranelift-module = "0.131"
cranelift-native = "0.131"
cranelift-object = "0.131"
regex = "1"
ed25519-dalek = "2"
sha2 = "0.10"
object = "0.39"
target-lexicon = "0.13"
ureq = "2"
zun_common = { path = "crates/zun_common", version = "0.0.0" }
zun_core = { path = "crates/zun_core", version = "0.0.0" }
zun_metadata = { path = "crates/zun_metadata", version = "0.0.0" }
zun_il = { path = "crates/zun_il", version = "0.0.0" }
zun_module = { path = "crates/zun_module", version = "0.0.0" }
zun_syntax = { path = "crates/zun_syntax", version = "0.0.0" }
zun_sema = { path = "crates/zun_sema", version = "0.0.0" }
zun_ilgen = { path = "crates/zun_ilgen", version = "0.0.0" }
zun_interp = { path = "crates/zun_interp", version = "0.0.0" }
zun_sched = { path = "crates/zun_sched", version = "0.0.0" }
zun_vm = { path = "crates/zun_vm", version = "0.0.0" }
zun_cli = { path = "crates/zun_cli", version = "0.0.0" }
zun_verify = { path = "crates/zun_verify", version = "0.0.0" }
zun_codegen = { path = "crates/zun_codegen", version = "0.0.0" }
zun_prelude = { path = "crates/zun_prelude", version = "0.0.0" }
zun_gc = { path = "crates/zun_gc", version = "0.0.0" }
zun_natives = { path = "crates/zun_natives", version = "0.0.0" }
zun_abi = { path = "crates/zun_abi", version = "0.0.0" }
zun_compiler = { path = "crates/zun_compiler", version = "0.0.0" }
zun_loader = { path = "crates/zun_loader", version = "0.0.0" }
zun_types = { path = "crates/zun_types", version = "0.0.0" }
zun_regex = { path = "crates/zun_regex", version = "0.0.0" }
zun_runtime = { path = "crates/zun_runtime", version = "0.0.0" }

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/urubucode/zun"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
opt-level = 3
lto = "thin"

# Debug/test builds default to full debug info (`debug = 2`), which on Windows
# produces very large `.pdb`/`.lib` artifacts and saturates disk I/O when many
# crates and test binaries link at once. These settings keep usable panic line
# numbers for workspace crates while dropping debug info for dependencies, which
# dramatically shrinks linker output and target size. `profile.test` inherits
# these. Bump `debug` back to 2 locally if you need to step through with a
# debugger.
[profile.dev]
debug = 1          # line tables only (keeps panic line numbers)

[profile.dev.package."*"]
debug = false      # no debug info for third-party dependencies
