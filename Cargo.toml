[workspace]
resolver = "2"
members = [
    "crates/zun_common",
    "crates/zun_core",
    "crates/zun_metadata",
    "crates/zun_il",
    "crates/zun_module",
    "crates/zun_syntax",
    "crates/zun_sema",
    "crates/zun_ilgen",
    "crates/zun_interp",
    "crates/zun_vm",
    "crates/zun_cli",
    "crates/zun_verify",
    "crates/zun_codegen",
    "crates/zun_prelude",
    "crates/zun_gc",
    "crates/zun_natives",
    "crates/zun_abi",
    "crates/zun_compiler",
    "crates/zun_loader",
    "crates/zun_types",
    "crates/zun_regex",
]

[workspace.dependencies]
cranelift-codegen = { version = "0.131", features = ["arm64"] }
cranelift-frontend = "0.131"
cranelift-jit = "0.131"
cranelift-module = "0.131"
cranelift-native = "0.131"
cranelift-object = "0.131"
regex = "1"
ed25519-dalek = "2"
sha2 = "0.10"
object = "0.39"
target-lexicon = "0.13"
ureq = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Drysius/zun"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
opt-level = 3
lto = "thin"
