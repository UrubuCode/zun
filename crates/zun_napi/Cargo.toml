[package]
name = "zun_napi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "C ABI host boundary for embedding the Zun VM."
build = "build.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
node-api = []

[dependencies]
zun_interp = { path = "../zun_interp" }
zun_il = { path = "../zun_il" }
zun_vm = { path = "../zun_vm" }

[dev-dependencies]
zun_compiler = { path = "../zun_compiler" }

[lints]
workspace = true
