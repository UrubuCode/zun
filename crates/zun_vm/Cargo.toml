[package]
name = "zun_vm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Zun virtual machine: loads a .zm module and runs it."

[lib]
crate-type = ["rlib", "staticlib"]

[features]
# Compiler-backed `new Function(...)`. Off by default so the runtime library
# links no compiler; the driver (zun_cli) and this crate's tests turn it on.
eval = ["dep:zun_compiler"]

[dependencies]
zun_compiler = { workspace = true, optional = true }
zun_interp = { workspace = true }
zun_sched = { workspace = true }
zun_module = { workspace = true }
zun_loader = { workspace = true }
zun_metadata = { workspace = true }
zun_il = { workspace = true }
zun_verify = { workspace = true }
zun_codegen = { workspace = true }
zun_gc = { workspace = true }
zun_core = { workspace = true }
zun_natives = { workspace = true }
zun_abi = { workspace = true }
libloading = "0.8"
target-lexicon = { workspace = true }

[dev-dependencies]
zun_vm = { path = ".", features = ["eval"] }
zun_core = { workspace = true }
zun_regex = { workspace = true }
zun_compiler = { workspace = true }
zun_ilgen = { workspace = true }
zun_sema = { workspace = true }
zun_syntax = { workspace = true }
zun_prelude = { workspace = true }

[lints]
workspace = true
