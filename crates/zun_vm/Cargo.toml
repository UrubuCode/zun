[package]
name = "zun_vm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Zun virtual machine: loads a .zm module and runs it."

[lib]
crate-type = ["rlib", "staticlib"]

[features]
# Compiler-backed `new Function(...)`. Off by default so the runtime library
# links no compiler; the driver (zun_cli) and this crate's tests turn it on.
eval = ["dep:zun_compiler"]

[dependencies]
zun_compiler = { path = "../zun_compiler", optional = true }
zun_interp = { path = "../zun_interp" }
zun_sched = { path = "../zun_sched" }
zun_module = { path = "../zun_module" }
zun_loader = { path = "../zun_loader" }
zun_metadata = { path = "../zun_metadata" }
zun_il = { path = "../zun_il" }
zun_verify = { path = "../zun_verify" }
zun_codegen = { path = "../zun_codegen" }
zun_gc = { path = "../zun_gc" }
zun_natives = { path = "../zun_natives" }
zun_abi = { path = "../zun_abi" }
libloading = "0.8"

[dev-dependencies]
zun_vm = { path = ".", features = ["eval"] }
zun_core = { path = "../zun_core" }
zun_regex = { path = "../zun_regex" }
zun_compiler = { path = "../zun_compiler" }
zun_ilgen = { path = "../zun_ilgen" }
zun_sema = { path = "../zun_sema" }
zun_syntax = { path = "../zun_syntax" }
zun_prelude = { path = "../zun_prelude" }

[lints]
workspace = true
