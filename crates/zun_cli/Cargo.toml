[package]
name = "zun_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The `zun` command-line driver."

[lib]
name = "zun_cli"
path = "src/lib.rs"

[[bin]]
name = "zun"
path = "src/main.rs"

[dependencies]
zun_compiler = { workspace = true }
zun_loader = { workspace = true }
zun_common = { workspace = true }
zun_syntax = { workspace = true }
zun_sema = { workspace = true }
zun_ilgen = { workspace = true }
zun_vm = { workspace = true, features = ["eval"] }
zun_module = { workspace = true }
zun_il = { workspace = true }
zun_prelude = { workspace = true }
zun_codegen = { workspace = true }
target-lexicon = { workspace = true }
sha2.workspace = true
zstd = "0.13"

[lints]
workspace = true
