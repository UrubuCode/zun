[package]
name = "zun_natives"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The runtime-implemented native surface, exposed as the single importable module zun:core (grouped internally: io, time, host, string, ...). Each group is self-contained (signature + logic) over neutral value types, so it depends on no other Zun crate."

[lints]
workspace = true

[dependencies]
zun_core = { workspace = true }
# ECMA-402 / Unicode surface (NUCLEUS: locale + normalization). `compiled_data`
# (default) bakes the CLDR "modern" data into the binary — the modern analog of
# Boa's `boa_icu_provider`, with no runtime data-provider plumbing.
icu = "2"
# Host/IANA time zone offsets for local Date (DST-aware). ICU4X has no offset lookup.
jiff = "0.2"
# OS randomness for Web Crypto (`crypto.randomUUID` / `getRandomValues`).
getrandom = "0.2"
