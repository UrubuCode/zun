[package]
name = "zun_natives"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native (runtime-implemented) modules: zun:io, zun:time. Each module is self-contained (signature + logic), using neutral value types so it depends on no other Zun crate."

[lints]
workspace = true

[dependencies]
zun_core = { path = "../zun_core" }
# ECMA-402 / Unicode surface (NUCLEUS: locale + normalization). `compiled_data`
# (default) bakes the CLDR "modern" data into the binary — the modern analog of
# Boa's `boa_icu_provider`, with no runtime data-provider plumbing.
icu = "2"
