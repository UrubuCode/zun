[package]
name = "zun_runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Zun shared runtime: a cdylib exposing the stable zun_rt_* C ABI."

[lib]
crate-type = ["cdylib"]

[features]
# Link the compiler so `zun_rt_run_eval` supports `new Function`.
eval = ["zun_vm/eval"]

[dependencies]
zun_vm = { workspace = true }

[dev-dependencies]
libloading = "0.8"
zstd = "0.13"
zun_syntax = { workspace = true }
zun_sema = { workspace = true }
zun_ilgen = { workspace = true }
zun_compiler = { workspace = true }

[lints]
workspace = true
